# Audited inputs of the overlay native XCFrameworks (shell syntax; sourced by
# scripts/*.sh). Upstream trees are git submodules under upstream/, pinned by
# the superproject's gitlinks; the commits below must match them, and the
# build refuses to run otherwise. Every downloaded archive and every committed
# build input is verified by SHA-256.

# Deployment target of every object in every slice.
DEPLOYMENT_TARGET="18.0"

# ---------------------------------------------------------------------------
# Tailscale: libtailscale (Go c-archive) as CTailscale
# ---------------------------------------------------------------------------

# Go toolchain used to build libtailscale, downloaded and verified; the host's
# own Go installation is never used.
GO_VERSION="go1.27.1"
GO_URL="https://go.dev/dl/go1.27.1.darwin-arm64.tar.gz"
GO_SHA256="ee215d57e0ec269c60cc9ceca68e6bda321ba9ee5afe24f4b0988703c2d87d12"
# No GOEXPERIMENT: tailscale.com v1.102.5 builds with Go 1.27's default
# encoding/json/v2.

# libtailscale has no release tags: submodule upstream/libtailscale.
LIBTAILSCALE_REPO="https://github.com/tailscale/libtailscale"
LIBTAILSCALE_COMMIT="59d4bb82744915815178e0f0776d60026a397ee7"
# The commit's go.mod requires tailscale.com v1.94.1; the build replaces its
# go.mod and go.sum with native/tailscale/go.mod and go.sum
# (`go get tailscale.com@v1.102.5 && go mod tidy` in that tree with
# heeler_tailscale.go added), which pin tailscale.com and every transitive
# module; module hashes are verified by that go.sum.
LIBTAILSCALE_UPSTREAM_TAILSCALE_VERSION="v1.94.1"
TAILSCALE_MODULE_VERSION="v1.102.5"
LIBTAILSCALE_GO_MOD_SHA256="b16f5e5aa627ae354d77f4fc1f8b7ea3c0d68c3c2a47590257b622bf11d15bbc"
LIBTAILSCALE_GO_SUM_SHA256="36aaa5ce20118a55be656de3747c51a959c60bfa61ee031094fe0a67d5cdff94"

# ---------------------------------------------------------------------------
# ZeroTier: libzt (ZeroTierOne + lwIP) as CZeroTier
# ---------------------------------------------------------------------------

# libzt: submodule upstream/libzt, Ylarod/libzt tag 1.16.2 (zerotier/libzt
# main a707ea6 plus ZeroTierOne 1.16.2, blocking zts_node_stop,
# ZTS_EVENT_NODE_DOWN ending the callback thread, opt-in metrics, offline
# tests). Its own submodules are pinned by libzt's gitlinks at the commits
# below (URLs from libzt's .gitmodules).
LIBZT_REPO="https://github.com/Ylarod/libzt"
LIBZT_COMMIT="7e5d0f99a2de81c45faa28e44289bcd19d933bf2"
# ZeroTierOne 1.16.2 (tag 1.16.2).
ZEROTIERONE_REPO="https://github.com/zerotier/ZeroTierOne"
ZEROTIERONE_COMMIT="fc5c3ec22090b5b2a0f274e863651fe9ca489bf4"
LWIP_REPO="https://github.com/joseph-henry/lwip"
LWIP_COMMIT="32708c0a8b140efb545cc35101ee5fdeca6d6489"
LWIP_CONTRIB_REPO="https://github.com/joseph-henry/lwip-contrib"
LWIP_CONTRIB_COMMIT="4fd612c9c72dfcd1db6618bd59c1a17d9f5b55f8"

# Patches to libzt and its ext/ZeroTierOne submodule, applied in order at the
# libzt root to the build copy: "file:sha256" pairs from patches/libzt.
ZEROTIER_PATCHES="0001-independent-root-sets.patch:b082d29c410f2e69ecdcf829ad57f6575173bb03add85b08253539790bacba43 0002-managed-gateway-routes.patch:ec02c07070d6a252e8042a5e1dfcdcfe2bcc4409e40a1bee758081982f03efdd 0003-metrics-saver-on-demand.patch:abb698416801341e03971a69c676ecc0e7d425b2e9c7c76a12b511729750984b"

# ---------------------------------------------------------------------------
# EasyTier: EasyTier through the heeler-easytier crate as CEasyTier
# ---------------------------------------------------------------------------

# Submodule upstream/EasyTier. 728ba94b is a 2.7.0 development commit, ahead
# of the 2.7.0 release; move the submodule to the v2.7.0 tag (and refresh the
# patches and native/easytier/Cargo.lock) once it is released.
EASYTIER_VERSION="2.7.0"
EASYTIER_REPO="https://github.com/EasyTier/EasyTier"
EASYTIER_COMMIT="728ba94b5029240add6204eed591f22e4e039e6b"
# Patches to that tree, applied in order to the build copy: "file:sha256"
# pairs from patches/easytier.
EASYTIER_PATCHES="0001-outbound-only-packet-proxy.patch:462f50093b32092c411c0584280dffccdc71cc528a55fddbbb0b46dd5d15c425 0002-web-client-backend.patch:efbb6003277fb3a835ed12537be8e719b3c41f97a638cf5dfdfdfbbbd87ed45b 0003-websocket-verify-server-certificates.patch:7d2d9822a1c411644cec3f393c7f07d17e43325217187ee6caad0ae7feb84fa5"
# Rust toolchain (rustup channel); must match native/easytier/rust-toolchain.toml.
EASYTIER_RUST_TOOLCHAIN="1.95.0"
# protoc, run by EasyTier's build scripts (prost-build) to generate its
# protobuf code; a build tool, not linked. Downloaded and verified; the
# host's protoc is never used (PROTOC points at this one).
PROTOC_VERSION="36.2"
PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-osx-aarch_64.zip"
PROTOC_SHA256="9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466"

